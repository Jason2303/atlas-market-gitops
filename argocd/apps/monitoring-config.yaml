# Our own monitoring content: alert rules, Grafana dashboards, ArgoCD ServiceMonitor,
# and the alert-sink webhook receiver. Plain Kustomize from this repo.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring-config
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  finalizers: [resources-finalizer.argocd.argoproj.io]
spec:
  project: platform
  source:
    repoURL: https://github.com/Jason2303/atlas-market-gitops.git
    targetRevision: main
    path: platform/monitoring-config
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - SkipDryRunOnMissingResource=true   # PrometheusRule/ServiceMonitor CRDs come from kube-prometheus-stack
    retry:
      limit: 10
      backoff: { duration: 15s, factor: 2, maxDuration: 5m }
